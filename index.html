<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Trabajadores - Santa Teresa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Display:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --border: #d8d8d3;
    --primary: #1a1a1a;
    --muted: #8a8a85;
    --accent: #b38600;
    --color-heading: #1b1b1b;
    --color-body: #3f3f3a;
    --color-secondary: #616159;
    --color-caption: #c8c8c2;
    --navy: #142a4d;
    --sans: 'Inter', system-ui, sans-serif;
    --display: 'Inter Display', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background-color: var(--bg2);
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1.5px);
    background-size: 18px 18px;
    margin: 0;
    padding: 32px 20px;
    color: var(--color-body);
  }
  .title {
    display: block;
    text-align: center;
    font-family: var(--display);
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    margin: 0 auto 16px;
  }
  h1 {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--color-heading);
    text-align: center;
    margin: 0 0 8px;
  }
  .subtitle {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.16px;
    color: var(--color-secondary);
    text-align: center;
    margin: 0 0 28px;
  }
  form {
    max-width: 460px;
    margin: 0 auto;
    background: var(--bg);
    padding: 28px;
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  label.field-label {
    display: block;
    margin-top: 18px;
    font-family: var(--display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.72px;
    text-transform: uppercase;
    color: var(--color-secondary);
  }
  label.field-label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.16px;
    color: var(--primary);
    background: var(--bg);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .checkbox-group label {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: -0.16px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--color-body);
    padding: 7px 10px;
    border-radius: 6px;
  }
  .checkbox-group input { width: auto; margin: 0; }

  .selfie-input { display: none; }
  .selfie-btn {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--primary);
    cursor: pointer;
  }
  .selfie-btn svg { width: 18px; height: 18px; flex: none; }
  .selfie-filename {
    font-size: 13px;
    color: var(--color-secondary);
    margin-top: 6px;
    text-align: center;
  }

  button[type="submit"] {
    width: 100%;
    margin-top: 24px;
    height: 44px;
    background: var(--primary);
    color: #f5f5f3;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.07px;
  }
  button[type="submit"]:disabled { opacity: 0.5; }
  #status {
    text-align: center;
    margin-top: 14px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--color-secondary);
  }
  .hint { font-size: 12.5px; color: var(--color-caption); margin-top: 4px; }
</style>
</head>
<body>

<div class="title">Trabajando En Santa Teresa</div>

<h1>Registro de Trabajadores</h1>
<p class="subtitle">Santa Teresa &mdash; llena tus datos para que empleadores te puedan contactar</p>

<form id="workerForm">

  <label class="field-label">Nombre completo</label>
  <input type="text" id="name" required>

  <label class="field-label">Número de WhatsApp</label>
  <input type="tel" id="whatsapp" placeholder="+505 8888 8888" required>

  <label class="field-label">Tipo de trabajo</label>
  <select id="jobType" required>
    <option value="">Selecciona...</option>
    <option value="builder">Construcción</option>
    <option value="gardener">Jardinería</option>
    <option value="security">Seguridad</option>
    <option value="cleaner">Limpieza</option>
    <option value="cook">Cocina</option>
    <option value="nanny">Niñera</option>
  </select>

  <div id="specialtiesWrap" style="display:none">
    <label class="field-label">Especialidades</label>
    <div class="checkbox-group" id="specialtiesGroup"></div>
  </div>

  <div id="toolsWrap" style="display:none">
    <label class="field-label">Herramientas que tienes o puedes conseguir</label>
    <div class="checkbox-group" id="toolsGroup"></div>
  </div>

  <label class="field-label">Disponibilidad</label>
  <select id="availability" required>
    <option value="">Selecciona...</option>
    <option value="full_time">Tiempo completo</option>
    <option value="part_time">Medio tiempo</option>
    <option value="weekends">Solo fines de semana</option>
    <option value="on_call">Por llamada / según se necesite</option>
  </select>

  <label class="field-label">Tarifa por hora (córdobas)</label>
  <input type="number" id="hourlyRate" min="0" step="1" required>

  <label class="field-label">Selfie</label>
  <label for="selfie" class="selfie-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.2"/></svg>
    Tomar foto
  </label>
  <input class="selfie-input" type="file" id="selfie" accept="image/*" capture="user" required>
  <p class="selfie-filename" id="selfieFilename"></p>

  <button type="submit" id="submitBtn" disabled>Enviar registro</button>
  <p id="status"></p>
</form>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://oajtkvzgsjdwtfmqsccs.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_sKNQ05XQ3KWnAYGsif4BfQ_VdmJ8mW0'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// job type -> checkbox options. One config object, no per-type branching code.
const JOB_OPTIONS = {
  builder: {
    specialties: ['Azulejos/Cerámica', 'Soldadura', 'Pintura', 'Plomería', 'Electricidad', 'Carpintería', 'Albañilería'],
    tools: ['Máquina de soldar', 'Sierra para azulejo', 'Taladro', 'Herramientas eléctricas', 'Escalera']
  },
  gardener: {
    specialties: ['Diseño de jardines', 'Poda de árboles', 'Riego'],
    tools: ['Moto guadaña (moto araña)', 'Machete', 'Cortadora de grama', 'Sopladora', 'Tijeras de podar']
  },
  security: {
    specialties: ['Turno nocturno', 'Turno diurno', 'Con experiencia armada'],
    tools: ['Radio', 'Linterna']
  },
  cleaner: {
    specialties: ['Limpieza de casas', 'Limpieza de negocios', 'Limpieza profunda'],
    tools: ['Aspiradora propia', 'Productos de limpieza propios']
  },
  cook: {
    specialties: ['Comida nicaragüense', 'Comida internacional', 'Repostería', 'Parrilla/BBQ'],
    tools: []
  },
  nanny: {
    specialties: ['Cuido de bebés', 'Cuido de niños mayores', 'Ayuda con tareas', 'Certificación CPR'],
    tools: []
  }
}

const jobTypeEl = document.getElementById('jobType')
const specialtiesWrap = document.getElementById('specialtiesWrap')
const specialtiesGroup = document.getElementById('specialtiesGroup')
const toolsWrap = document.getElementById('toolsWrap')
const toolsGroup = document.getElementById('toolsGroup')

function renderCheckboxes(container, options, namePrefix) {
  container.innerHTML = options.map((opt) => `
    <label>
      <input type="checkbox" name="${namePrefix}" value="${opt}">
      ${opt}
    </label>
  `).join('')
}

jobTypeEl.addEventListener('change', () => {
  const opts = JOB_OPTIONS[jobTypeEl.value]
  if (!opts) {
    specialtiesWrap.style.display = 'none'
    toolsWrap.style.display = 'none'
    return
  }
  renderCheckboxes(specialtiesGroup, opts.specialties, 'specialty')
  renderCheckboxes(toolsGroup, opts.tools, 'tool')
  specialtiesWrap.style.display = opts.specialties.length ? 'block' : 'none'
  toolsWrap.style.display = opts.tools.length ? 'block' : 'none'
})

document.getElementById('selfie').addEventListener('change', (e) => {
  const file = e.target.files[0]
  document.getElementById('selfieFilename').textContent = file ? file.name : ''
})

function checkedValues(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(el => el.value)
}

const form = document.getElementById('workerForm')
const statusEl = document.getElementById('status')
const submitBtn = document.getElementById('submitBtn')
submitBtn.disabled = false

form.addEventListener('submit', async (e) => {
  e.preventDefault()
  submitBtn.disabled = true
  statusEl.textContent = 'Enviando...'

  try {
    const selfieFile = document.getElementById('selfie').files[0]
    const filePath = `${Date.now()}_${selfieFile.name}`

    const { error: uploadError } = await supabase.storage
      .from('selfies')
      .upload(filePath, selfieFile)
    if (uploadError) throw uploadError

    const { data: publicUrlData } = supabase.storage
      .from('selfies')
      .getPublicUrl(filePath)

    const { error: insertError } = await supabase.from('workers').insert({
      name: document.getElementById('name').value,
      whatsapp: document.getElementById('whatsapp').value,
      job_type: jobTypeEl.value,
      specialties: checkedValues('specialty'),
      tools: checkedValues('tool'),
      availability: document.getElementById('availability').value,
      hourly_rate: Number(document.getElementById('hourlyRate').value),
      selfie_url: publicUrlData.publicUrl
    })
    if (insertError) throw insertError

    statusEl.textContent = '¡Registro enviado! Gracias.'
    form.reset()
    specialtiesWrap.style.display = 'none'
    toolsWrap.style.display = 'none'
    document.getElementById('selfieFilename').textContent = ''
    submitBtn.disabled = false
  } catch (err) {
    console.error(err)
    statusEl.textContent = 'Error al enviar. Intenta de nuevo.'
    submitBtn.disabled = false
  }
})
</script>

</body>
</html>
