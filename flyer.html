<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flyer - Registro de Trabajadores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Display:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #1a1a1a;
    --color-secondary: #616159;
    --dot: #9a9a92;
    --navy: #142a4d;
    --sans: 'Inter', system-ui, sans-serif;
    --display: 'Inter Display', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  @page { size: A4; margin: 0; }
  body { margin: 0; }
  .flyer {
    width: 210mm;
    height: 297mm;
    padding: 22mm 18mm;
    background-color: #ffffff;
    background-image: radial-gradient(circle, var(--dot) 1.6px, transparent 2px);
    background-size: 14mm 14mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14mm;
  }
  .title {
    font-family: var(--display);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--navy);
    margin-top: -12mm;
  }
  .headline {
    font-family: var(--display);
    font-size: 30px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--primary);
    max-width: 150mm;
  }
  .qr-box {
    background: #ffffff;
    border: 1px solid #1a1a1a;
    padding: 8mm;
  }
  .qr-box img { width: 68mm; height: 68mm; display: block; }
  .caption {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--primary);
  }
</style>
</head>
<body>

<div class="flyer">
  <div class="title">Trabajando En Santa Teresa</div>

  <div class="headline">
    Conectando trabajadores con empleadores en Santa Teresa — encuentra trabajo o gana dinero extra. Escanea el código QR y agrega tus datos gratis.
  </div>

  <div class="qr-box">
    <img src="worker_signup_qr.png" alt="Código QR de registro">
  </div>

  <div class="caption">Este servicio es gratis para trabajadores</div>
</div>

</body>
</html>
